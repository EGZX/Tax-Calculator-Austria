[project]
name = "tax-calc-at"
version = "0.1.0"
description = "Austrian foreign-broker capital-gains (E1kv) tax calculator"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.66",
    "pandas>=3.0",
    "pydantic>=2.14",
    "pyyaml>=6.0.3",
    "requests>=2.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "mypy>=2.4",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.33",
    "pandas-stubs>=3.1",
]

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Synthetic broker-export rows are kept on one line to mirror the real format.
"tests/*" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/tax_calc_at"]

[[tool.mypy.overrides]]
# Streamlit ships without complete type information for its widget API.
module = ["streamlit", "streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
